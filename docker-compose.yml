
services:
  helloworld:
    image: hello-world:latest
    volumes:
      - ./data:/app/data

  app:
    image: python:3.12-slim
    depends_on:
      - db
    command: sleep infinity

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ma_base
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_mot_de_passe
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
